# Uptime monitor for journal.samadicapital.com — runs on GitHub, outside Cloudflare.
# Every 10 minutes it checks the app page, its jsDelivr script, the API and the alert engine.
# A failure must repeat after 60 s before the run fails; GitHub then emails the repo admins.
# Public URLs only, no secrets.
name: monitor
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: check journal
        run: |
          set -u
          check() {
            local fail=""
            local page; page=$(curl -fsS --max-time 20 "https://journal.samadicapital.com/app/?m=$(date +%s)") || fail="app page unreachable"
            if [ -z "$fail" ]; then
              local js; js=$(printf '%s' "$page" | grep -o 'https://cdn.jsdelivr.net/gh/[^"]*app\.[0-9a-f]*\.js' | head -1)
              [ -n "$js" ] || fail="app page has no jsDelivr script"
              [ -z "$fail" ] && { curl -fsS --max-time 30 -o /dev/null "$js" || fail="jsDelivr script unreachable: $js"; }
            fi
            [ -z "$fail" ] && { curl -fsS --max-time 20 -o /dev/null https://journal.samadicapital.com/api/billing/catalog || fail="API unreachable"; }
            if [ -z "$fail" ]; then
              local eng; eng=$(curl -sS --max-time 20 -w ' HTTP%{http_code}' https://journal.samadicapital.com/api/health/engine) || true
              case "$eng" in *'"ok":true'*HTTP200) ;; *) fail="alert engine unhealthy: $eng";; esac
            fi
            echo "${fail}"
          }
          first=$(check)
          if [ -z "$first" ]; then echo "OK"; exit 0; fi
          echo "first check failed: $first — retrying in 60 s"
          sleep 60
          second=$(check)
          if [ -z "$second" ]; then echo "recovered on retry"; exit 0; fi
          echo "::error::journal.samadicapital.com problem: $second"
          exit 1
